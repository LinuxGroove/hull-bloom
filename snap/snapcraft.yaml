name: verdigris-protocol
title: Verdigris Protocol
adopt-info: verdigris-protocol
base: core24
summary: A first person horror shooter against an alien growth on a space station.
description: |
  The alien isn't aboard Marigold Station. It's growing through it.

  You're the night shift engineer on a farming station where something
  came up through the soil in Hydroponics. Now a red, wet growth called
  the Bloom spreads through the decks, room by room, taking the crew as
  it goes. Burn it back with a plasma cutter, cut the power it feeds on,
  seal doors, light flares, and dig out the Heart that roots each deck.

  - Eight decks round a ring, each with its own creatures, weapons and
    a reason to save it; the ones you leave are lost to the Bloom
  - The growth spreads in real time: through open doors, along power
    lines, into the dark
  - Gore, dismemberment and a Gore setting (Full, Less or Off) that can
    be locked with a code
  - Comfort settings: no head bob or view roll by default
  - Shift mode: a new station every night, with online boards
  - Plays fully offline, with a keyboard and mouse or a controller
icon: snap/gui/verdigris-protocol.svg
grade: stable
confinement: strict
compression: lzo
license: MIT AND CC0-1.0 AND Apache-2.0 AND OFL-1.1
website: https://github.com/LinuxGroove/verdigris-protocol
source-code: https://github.com/LinuxGroove/verdigris-protocol
issues: https://github.com/LinuxGroove/verdigris-protocol/issues

platforms:
  amd64:
  arm64:

apps:
  verdigris-protocol:
    command: bin/verdigris-protocol
    extensions: [gnome]
    plugs:
      - audio-playback
      - joystick
      - network

parts:
  verdigris-protocol:
    plugin: nil
    source: .
    build-packages:
      - curl
      - unzip
      - ca-certificates
      - libfontconfig1
    stage-packages:
      - libasound2t64
      - libpulse0
      - libdecor-0-0
      - libfontconfig1
      - libudev1
      - libwayland-client0
      - libwayland-cursor0
      - libwayland-egl1
      - libxkbcommon0
      - libx11-6
      - libxcursor1
      - libxext6
      - libxi6
      - libxinerama1
      - libxrandr2
      - libxrender1
      - libdbus-1-3
    override-pull: |
      craftctl default
      craftctl set version="$(sed -n 's/^config\/version="\(.*\)"/\1/p' project.godot)"
    override-build: |
      # Godot version used to export; keep in step with the project.
      GODOT_VERSION=4.7.2
      case "$CRAFT_ARCH_BUILD_FOR" in
        amd64) ARCH=x86_64; PRESET=Linux ;;
        arm64) ARCH=arm64; PRESET="Linux ARM64" ;;
        *) echo "Unsupported architecture: $CRAFT_ARCH_BUILD_FOR"; exit 1 ;;
      esac
      BASE="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
      curl -sSfL -o godot.zip "$BASE/Godot_v${GODOT_VERSION}-stable_linux.${ARCH}.zip"
      curl -sSfL -o templates.tpz "$BASE/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
      unzip -o -q godot.zip
      GODOT="$PWD/Godot_v${GODOT_VERSION}-stable_linux.${ARCH}"
      export HOME="$PWD/.home"
      TEMPLATES="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
      mkdir -p "$TEMPLATES"
      unzip -o -q -j templates.tpz "templates/linux_release.${ARCH}" templates/version.txt -d "$TEMPLATES"
      "$GODOT" --headless --path . --import
      "$GODOT" --headless --path . --import
      mkdir -p "$CRAFT_PART_INSTALL/game" "$CRAFT_PART_INSTALL/bin"
      "$GODOT" --headless --path . --export-release "$PRESET" "$CRAFT_PART_INSTALL/game/verdigris-protocol"
      test -f "$CRAFT_PART_INSTALL/game/verdigris-protocol.pck"
      install -m 755 snap/local/verdigris-protocol "$CRAFT_PART_INSTALL/bin/"
      cp LICENSE CREDITS.md "$CRAFT_PART_INSTALL/game/"
